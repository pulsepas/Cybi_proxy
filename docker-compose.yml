services:
  proxy:
    build: .
    image: cybi-proxy:local
    container_name: cybi-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
